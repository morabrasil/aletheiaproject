<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="aletheia project: public-domain philosophy in one place, read in the original language.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>aletheia project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Cardo:ital@0;1&family=Marcellus&display=swap">
<style>
/* Layout: reading room — fixed index on the left, one measured text column, reference pagination in the margin like a critical edition. Palette: graphite and ochre. */
:root{
  --paper:#F6F5F2;
  --sheet:#FCFBF9;
  --ink:#1E1D1B;
  --ink-soft:#615D57;
  --rule:#DDDAD4;
  --accent:#8A5A1C;
  --accent-tint:#F3E8D6;
  --mark:#F1DFA8;
  --venetian:"Venetian301 BT", "Venetian 301 BT", "Venetian 301", "Centaur MT", "Centaur";
  --display:"Libre Caslon Text", "Cardo", Georgia, serif;
  --text:"Libre Caslon Text", "Cardo", "Iowan Old Style", Georgia, serif;
  --ui:"Libre Caslon Text", "Cardo", "Iowan Old Style", Georgia, serif;
  --mono:"Libre Caslon Text", "Cardo", Georgia, serif;
  --chrome:"Marcellus", "Libre Caslon Text", Georgia, serif;
  --brand:"Libre Caslon Text", "Cardo", Georgia, serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1F1F1F; --sheet:#262625; --ink:#E4E2DE; --ink-soft:#9C9994; --rule:#383838;
  --accent:#D2A266; --accent-tint:#3A3126; --mark:#5C4A24; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1F1F1F; --sheet:#262625; --ink:#E4E2DE; --ink-soft:#9C9994; --rule:#383838;
  --accent:#D2A266; --accent-tint:#3A3126; --mark:#5C4A24; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;font-variant-numeric:oldstyle-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:1px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-size:19px;font-weight:600;text-decoration:none;letter-spacing:.01em;white-space:nowrap}
.brand i{font-weight:400;color:var(--accent)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .wm{font-family:var(--brand);font-weight:400;font-size:21px;letter-spacing:.01em;line-height:1}
.brand .wm i{font-style:normal;color:var(--accent)}
.brand .gk{font-weight:400;font-style:italic;font-size:15px;color:var(--accent);padding-right:10px;border-right:1px solid var(--rule)}
@media (max-width:420px){.brand .gk{display:none}}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;font:inherit;padding:8px 12px 8px 34px;border:1px solid var(--rule);border-radius:1px;background:var(--paper);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.lang{display:flex;border:1px solid var(--rule);border-radius:1px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 10px;font-size:13px;font-weight:500;letter-spacing:.04em;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--sheet)}

/* cascading picker */
.picker{border-top:1px solid var(--rule)}
.picker-in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end;
  padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld span{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.fld span i{font-style:normal;font-family:var(--mono);color:var(--accent)}
.fld select{appearance:none;-webkit-appearance:none;width:100%;min-width:0;font:inherit;font-size:14px;color:var(--ink);
  background-color:var(--paper);border:1px solid var(--rule);border-radius:1px;padding:8px 34px 8px 11px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.fld select:hover:not(:disabled){border-color:var(--ink-soft)}
.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.fld select:disabled{opacity:.5;cursor:not-allowed}
.go{font:inherit;font-size:14px;font-weight:400;letter-spacing:.06em;border:0;border-radius:1px;padding:9px 18px;background:var(--accent);color:var(--sheet);white-space:nowrap}
.go:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:760px){
  .top{position:static}
  .para{scroll-margin-top:16px}
  .picker-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .picker-in .fld:nth-child(3){grid-column:1/-1}
  .go{grid-column:1/-1}
}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;border-top:1px solid var(--ink);padding-block:24px 64px}
.howto div{min-width:0}
.howto b{display:block;font-family:var(--display);font-weight:500;font-size:19px;margin-bottom:6px}
.howto p{margin:0;font-size:14px;color:var(--ink-soft)}
.howto .n{font-family:var(--mono);font-size:12px;color:var(--accent);margin-bottom:6px;display:block}
@media (max-width:760px){.howto{grid-template-columns:minmax(0,1fr)}}

.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* home */
.intro{padding-block:56px 32px;max-width:720px}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.12;margin:0 0 16px;text-wrap:balance}
.intro h1 em{color:var(--accent)}
.intro p{color:var(--ink-soft);font-size:16px;max-width:60ch;margin:0}
.stats{margin-top:20px;font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.02em}
.authors{border-top:1px solid var(--ink);margin-bottom:64px}
.author{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:24px;padding-block:24px;border-bottom:1px solid var(--rule)}
.author h2{font-family:var(--display);font-weight:500;font-size:24px;margin:0}
.author .life{font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-top:4px}
.author .langs{font-size:12px;color:var(--ink-soft);margin-top:8px;text-transform:uppercase;letter-spacing:.08em}
.works{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.works a{display:grid;grid-template-columns:3.5rem minmax(0,1fr);gap:12px;padding:8px 10px;margin-inline:-10px;border-radius:1px;text-decoration:none}
.works a:hover{background:var(--accent-tint)}
.works .yr{font-family:var(--mono);font-size:13px;color:var(--ink-soft);padding-top:3px;font-variant-numeric:tabular-nums}
.works .ot{font-family:var(--text);font-style:italic;font-size:17px}
.works .tt{font-size:13px;color:var(--ink-soft)}

/* periods (home) */
.eras{border-top:1px solid var(--ink);margin-bottom:64px}
.era{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) minmax(0,1.1fr) 24px;gap:8px 28px;align-items:baseline;
  padding:26px 12px;margin-inline:-12px;border-bottom:1px solid var(--rule);text-decoration:none;border-radius:1px;transition:background .15s}
a.era:hover{background:var(--accent-tint)}
.era .span{font-family:var(--mono);font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.era h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.1;margin:0}
.era p{margin:6px 0 0;font-size:14px;color:var(--ink-soft)}
.era .who{font-family:var(--text);font-size:16px;line-height:1.5}
.era .who small{display:block;font-family:var(--ui);font-size:12px;color:var(--ink-soft);margin-top:4px;letter-spacing:.02em}
.era .arr{color:var(--accent);font-size:20px;align-self:center}
.era.off{opacity:.55}
.era.off .who{font-family:var(--ui);font-size:13px;color:var(--ink-soft);font-style:italic}

/* period + author pages */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);padding-top:28px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.phead{padding-block:14px 28px;max-width:720px}
.phead .span{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
.phead h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,44px);line-height:1.1;margin:6px 0 10px;text-wrap:balance}
.phead p{margin:0;color:var(--ink-soft);font-size:16px;max-width:60ch}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;border-top:1px solid var(--ink);padding-top:24px;margin-bottom:64px}
.acard{display:flex;flex-direction:column;gap:6px;padding:20px;border:1px solid var(--rule);border-radius:1px;background:var(--sheet);text-decoration:none;transition:border-color .15s}
.acard:hover{border-color:var(--accent)}
.acard h2{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.2;margin:0}
.acard .life{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.acard .ws{margin-top:10px;font-family:var(--text);font-style:italic;font-size:14px;color:var(--ink-soft);line-height:1.45}
.acard .foot{margin-top:auto;padding-top:12px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.alist{border-top:1px solid var(--ink);padding-top:12px;margin-bottom:64px;max-width:820px}
@media (max-width:760px){
  .era{grid-template-columns:minmax(0,1fr) 24px}
  .era .span{grid-column:1/-1;order:-1}
  .era .who{grid-column:1/2}
  .era .arr{grid-row:2}
}

/* reader */
.reader{display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;padding-block:32px 80px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px);align-self:start;max-height:calc(100vh - 170px);overflow:auto;font-size:14px}
.toc-toggle{display:none}
.crumb{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:12px}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--accent)}
.toc h3{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 4px}
.toc .tocw{margin-bottom:18px}
.toc .tocw > a{display:block;text-decoration:none;font-family:var(--text);font-style:italic;padding:4px 0;color:var(--ink-soft)}
.toc .tocw > a.cur{color:var(--ink);font-weight:500}
.toc ol{list-style:none;margin:2px 0 6px;padding:0 0 0 12px;border-left:1px solid var(--rule)}
.toc li a,.toc li span{display:block;padding:4px 8px;text-decoration:none;border-radius:1px}
.toc li a:hover{background:var(--accent-tint)}
.toc li a.cur{color:var(--accent);font-weight:600}
.toc li span{color:var(--ink-soft);opacity:.6}
.toc li span small{font-size:11px}

.page{min-width:0;max-width:760px}
.whead{border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:28px}
.whead .who{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.whead h1{font-family:var(--display);font-weight:400;font-style:italic;font-size:clamp(26px,4vw,36px);line-height:1.15;margin:6px 0 4px;text-wrap:balance}
.whead .trans{font-size:15px;color:var(--ink-soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:13px;color:var(--ink-soft)}
.meta b{font-weight:600;color:var(--ink)}
.about{margin-top:14px;font-size:14px;color:var(--ink-soft);max-width:62ch}
.sec-title{font-family:var(--display);font-weight:500;font-size:21px;margin:0 0 4px}
.sec-sub{font-size:13px;color:var(--ink-soft);margin:0 0 24px}

.para{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 2rem;gap:0 14px;padding:6px 0;margin:0 -8px;padding-inline:8px;border-radius:1px;scroll-margin-top:170px}
.para .ref{font-family:var(--mono);font-size:12px;font-style:italic;color:var(--accent);text-align:right;padding-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.para .tx{font-family:var(--text);font-size:17px;line-height:1.75;hyphens:auto;-webkit-hyphens:auto;max-width:62ch;margin:0}
.para .cite{opacity:0;align-self:start;margin-top:6px;border:1px solid var(--rule);background:var(--sheet);border-radius:1px;width:28px;height:28px;display:grid;place-items:center;color:var(--ink-soft);transition:opacity .15s}
.para:hover .cite,.para .cite:focus-visible{opacity:1}
.para.hit{background:var(--accent-tint)}
mark{background:var(--mark);color:inherit;border-radius:1px;padding:0 1px}
.pend{border:1px dashed var(--rule);border-radius:1px;padding:20px;color:var(--ink-soft);font-size:14px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--rule);font-size:14px}
.pager a{text-decoration:none;color:var(--accent);max-width:48%}
.pager a small{display:block;color:var(--ink-soft);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.note{font-size:12px;color:var(--ink-soft);margin-top:28px;font-style:italic}

/* search */
.sres{padding-block:32px 80px;max-width:820px}
.sres h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0 0 6px}
.sres .hint{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:1px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.res{display:block;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--rule)}
.res .where{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.res .where b{color:var(--accent);font-family:var(--mono);font-weight:500;text-transform:none;letter-spacing:0}
.res .snip{font-family:var(--text);font-size:16px;line-height:1.6;margin-top:4px}
.res:hover .snip{color:var(--accent)}
.try{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);align-items:center}
.try button{border:1px solid var(--rule);background:var(--sheet);border-radius:1px;padding:2px 8px;font-family:var(--text);font-style:italic}

.themebtn{display:grid;place-items:center;width:34px;height:32px;border:1px solid var(--rule);border-radius:1px;background:var(--paper);color:var(--ink)}
.themebtn:hover{border-color:var(--ink-soft)}
.themebtn .moon{display:none}
:root[data-theme="dark"] .themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .moon{display:block}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .themebtn .sun{display:none} :root:not([data-theme="light"]) .themebtn .moon{display:block} }
.citesel{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.citesel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);
  background-color:var(--paper);border:1px solid var(--rule);border-radius:1px;padding:6px 26px 6px 10px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.citesel select:focus{outline:none;border-color:var(--accent)}
.copyhint{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding:10px 12px;border-radius:1px;background:var(--accent-tint);font-size:13px;color:var(--ink)}
.copyhint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:1px;padding:0 4px;background:var(--sheet)}
.copyhint b{color:var(--accent)}
.copyhint{flex-wrap:wrap;align-items:center}
.refbox{margin-top:20px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:14px}
.refhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
#reftitle{font-family:var(--chrome);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
#reftitle b{font-weight:400;color:var(--accent)}
.reftext{font-family:var(--text);font-size:15px;line-height:1.6;padding-left:2em;text-indent:-2em;overflow-wrap:anywhere;user-select:all}
.reftext p{margin:0 0 6px}
.reftext i{font-style:italic}
.refhint{margin:12px 0 0;font-size:13px;color:var(--ink-soft)}
.refhint kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);border-bottom-width:2px;padding:0 4px;background:var(--sheet)}
.refhint b{font-weight:400;color:var(--accent)}
.refbtn{font-family:var(--chrome)!important;font-size:12px!important;font-weight:400!important;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px!important}
.refbtn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:var(--sheet);border-radius:1px;padding:6px 12px;white-space:nowrap}
.refbtn:hover{background:var(--accent);color:var(--sheet)}
.toast{white-space:pre-line;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:1px;font-size:13px;max-width:calc(100% - 32px)}

@media (max-width:860px){
  .reader{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:20px}
  .toc{position:static;max-height:none;border:1px solid var(--rule);border-radius:1px;padding:12px;background:var(--sheet)}
  .toc-toggle{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:0;font-weight:600}
  .toc-body{margin-top:12px}
  .toc.closed .toc-body{display:none}
  .author{grid-template-columns:minmax(0,1fr);gap:12px}
}
@media (max-width:560px){
  .para{grid-template-columns:minmax(0,1fr) 2rem}
  .para .ref{grid-column:1/-1;text-align:left;padding-top:0}
  .para .cite{opacity:1}
  .para .tx{font-size:17px}
}
/* top bar in Marcellus: Roman-inscription capitals for labels, regular case in the menus */
.top .search input,.top .lang button,.top .citesel,.top .citesel select,.picker .fld select,.picker .go{font-family:var(--chrome)}
.top .search input{font-size:14px}
.top .lang button{font-size:12px;letter-spacing:.1em}
.top .citesel{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.top .citesel select{font-size:14px;letter-spacing:.02em;text-transform:none}
.picker .fld span{font-family:var(--chrome);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.picker .fld span i{font-family:var(--chrome);font-style:normal;letter-spacing:0}
.picker .fld select{font-size:14px;letter-spacing:.02em}
.picker .go{font-size:13px;font-weight:400;letter-spacing:.14em;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">

const MPT = ["jan.","fev.","mar.","abr.","maio","jun.","jul.","ago.","set.","out.","nov.","dez."];
const MEN = ["Jan.","Feb.","Mar.","Apr.","May","June","July","Aug.","Sept.","Oct.","Nov.","Dec."];

function citeParts(a,w,secId,locator,quote,style){
  const n = NAMES[a.id], b = BIB[`${a.id}.${w.id}`] || {orig:loc(w.year), origEn:loc(w.year)};
  const title = b.title || w.title;
  const url = `${BASE_URL}#${a.id}.${w.id}.${secId}`;
  const d = new Date(), y = d.getFullYear();
  const accPt = `${d.getDate()} ${MPT[d.getMonth()]} ${y}`, accEn = `${d.getDate()} ${MEN[d.getMonth()]} ${y}`;
  const ed = b.ed;
  const long = quote && quote.length > 240;
  const I = s=>`<i>${esc(s)}</i>`;
  let inText="", inTextH="", ref="", refH="", label="";
  if(style==="abnt"){
    label = "Referência";
    const call = `(${n.ptLast}, ${b.orig}, ${locator})`;
    if(quote){ inText = long ? `${quote} ${call}.` : `“${quote}” ${call}.`;
      inTextH = long ? `<p style="margin-left:4cm;font-size:10pt;line-height:1">${esc(quote)} ${esc(call)}.</p>` : `<p>“${esc(quote)}” ${esc(call)}.</p>`; }
    const edT = ed ? `${ed.note?ed.note+". ":""}${ed.place}: ${ed.pub}, ${ed.year}. ` : "";
    ref = `${n.abnt}. ${title}. ${edT}In: ${SITE}. Disponível em: ${url}. Acesso em: ${accPt}.`;
    refH = `${esc(n.abnt)}. <b>${esc(title)}</b>. ${esc(edT)}In: ${esc(SITE)}. Disponível em: ${esc(url)}. Acesso em: ${accPt}.`;
  } else if(style==="apa"){
    label = "Reference";
    const call = `(${n.enLast}, ${b.origEn}/${y}, ${locator})`;
    if(quote){ inText = long ? `${quote} ${call}` : `"${quote}" ${call}.`;
      inTextH = long ? `<p style="margin-left:0.5in">${esc(quote)} ${esc(call)}</p>` : `<p>"${esc(quote)}" ${esc(call)}.</p>`; }
    ref = `${n.apa} (${y}). ${title}. ${SITE}. ${url} (Original work published ${b.origEn})`;
    refH = `${esc(n.apa)} (${y}). ${I(title)}. ${esc(SITE)}. ${esc(url)} (Original work published ${esc(b.origEn)})`;
  } else if(style==="chicago"){
    label = "Reference List";
    const call = `(${n.enLast} ${b.origEn}, ${locator})`;
    if(quote){ inText = long ? `${quote} ${call}` : `“${quote}” ${call}.`;
      inTextH = long ? `<p style="margin-left:0.5in">${esc(quote)} ${esc(call)}</p>` : `<p>“${esc(quote)}” ${esc(call)}.</p>`; }
    const pubT = ed ? ` ${ed.place}: ${ed.pub}.` : "";
    ref = `${n.inv}. ${b.origEn}. ${title}.${pubT} ${SITE}. ${url}.`;
    refH = `${esc(n.inv)}. ${esc(b.origEn)}. ${I(title)}.${esc(pubT)} ${esc(SITE)}. ${esc(url)}.`;
  } else if(style==="mla"){
    label = "Works Cited";
    const call = `(${n.enLast} ${locator})`;
    if(quote){ inText = long ? `${quote} ${call}` : `“${quote}” ${call}.`;
      inTextH = long ? `<p style="margin-left:0.5in">${esc(quote)} ${esc(call)}</p>` : `<p>“${esc(quote)}” ${esc(call)}.</p>`; }
    ref = `${n.inv}. ${title}. ${b.origEn}. ${SITE}, ${url}. Accessed ${accEn}.`;
    refH = `${esc(n.inv)}. ${I(title)}. ${esc(b.origEn)}. ${I(SITE)}, ${esc(url)}. Accessed ${accEn}.`;
  }
  return {inText, inTextH, ref, refH:refH.startsWith("<p>")?refH:`<p>${refH}</p>`, label};
}

/* ---------- search ---------- */
function norm(s){
  return s.toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/th/g,"t").replace(/aa/g,"a").replace(/ey/g,"ei").replace(/[^\p{L}\p{N}\s]/gu," ");
}
function highlight(text,terms){
  return text.split(/(\s+)/).map(tok=>{
    if(/^\s+$/.test(tok)) return tok;
    const n = norm(tok);
    return terms.some(q=>n.includes(q)) ? `<mark>${esc(tok)}</mark>` : esc(tok);
  }).join("");
}
function renderSearch(){
  const raw = $("#q").value.trim();
  const terms = norm(raw).split(/\s+/).filter(x=>x.length>1);
  const hits = [];
  if(terms.length) DATA.forEach(a=>{
    if(filterAuthor!=="all" && filterAuthor!==a.id) return;
    a.works.forEach(w=>w.secs.forEach(s=>(s.paras||[]).forEach((p,k)=>{
      const n = norm(p.t);
      if(terms.every(q=>n.includes(q))) hits.push({a,w,s,p,k});
    })));
  });
  const samples = ["Theil","Vernunft","Ware","Geschichte","substantia"];
  app.innerHTML = `<section class="sres">
    <h1>${t("sres")}${raw?` · <i style="font-style:italic">${esc(raw)}</i>`:""}</h1>
    <p class="hint">${t("hintS")}</p>
    <div class="chips" role="group">
      <button class="chip" data-f="all" aria-pressed="${filterAuthor==="all"}">${t("all")}</button>
      ${DATA.map(a=>`<button class="chip" data-f="${a.id}" aria-pressed="${filterAuthor===a.id}">${esc(aShort(a))}</button>`).join("")}
    </div>
    ${terms.length
      ? `<div class="hint" style="font-family:var(--mono);font-size:12px">${t("found")(hits.length)}</div>
         ${hits.length? hits.map(h=>`<a class="res" href="#${h.a.id}.${h.w.id}.${h.s.id}.p${h.k+1}">
            <div class="where">${esc(aShort(h.a))} · <span lang="${h.a.lang}" style="text-transform:none;font-style:italic">${esc(h.w.title)}</span> · <b>${esc(h.p.ref)}</b></div>
            <div class="snip" lang="${h.a.lang}">${highlight(h.p.t,terms)}</div></a>`).join("") : `<p>${t("none")}</p>`}`
      : `<div class="try">${t("tryit")} ${samples.map(s=>`<button data-try="${s}">${s}</button>`).join("")}</div>`}
  </section>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filterAuthor=b.dataset.f;renderSearch();});
  app.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>{$("#q").value=b.dataset.try;go("busca");});
}

/* ---------- routing ---------- */
function go(h){ if(location.hash.slice(1)===h) route(); else location.hash = h; }
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h==="busca"){ renderSearch(); return; }
  const parts = h.split(".");
  const au = DATA.find(a=>a.id===parts[0]);
  if(parts.length>=2 && au){ syncPicker(au.period,au.id,parts[1]); return renderReader(parts[0],parts[1],parts[2],parts[3]); }
  const per = PERIODS.find(p=>p.id===h);
  if(per && authorsOf(per.id).length){ syncPicker(per.id,"",""); return renderPeriod(per); }
  if(au){ syncPicker(au.period,au.id,""); return renderAuthor(au); }
  syncPicker("","",""); renderHome(); window.scrollTo(0,0);
}

function updateHint(){
  const h = document.getElementById("copyhint"); if(!h) return;
  const st = CS==="plain" ? "abnt" : CS;
  h.innerHTML = CS==="plain" ? t("hintPlain") : t("hint")(STYLE_NAMES[CS]);
  const rt = document.getElementById("reftext");
  if(rt){
    const f = findWork(rt.dataset.a,rt.dataset.w);
    if(f) rt.innerHTML = citeParts(f.a,f.w,rt.dataset.s,"","",st).refH;
  }
  const tt = document.getElementById("reftitle");
  if(tt) tt.innerHTML = `${t("refTitle")} · <b>${STYLE_NAMES[st]}</b>`;
  const rb = document.getElementById("refbtn");
  if(rb) rb.textContent = t("refBtn");
}
function writeClip(plain,html,okMsg){
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      navigator.clipboard.write([new ClipboardItem({"text/plain":new Blob([plain],{type:"text/plain"}),"text/html":new Blob([html],{type:"text/html"})})])
        .then(()=>toast(okMsg),()=>fallbackText(plain,okMsg));
    } else fallbackText(plain,okMsg);
  }catch(err){ fallbackText(plain,okMsg); }
}
function fallbackText(plain,okMsg){
  try{ navigator.clipboard.writeText(plain).then(()=>toast(okMsg),()=>toast(`${t("copyFail")}\n${plain}`)); }
  catch(err){ toast(`${t("copyFail")}\n${plain}`); }
}
/* botão: copia só a referência do parágrafo */
app.addEventListener("click",e=>{
  const rb = e.target.closest("#refbtn");
  if(rb){
    const f = findWork(rb.dataset.a,rb.dataset.w); if(!f) return;
    const st = CS==="plain" ? "abnt" : CS;
    const c = citeParts(f.a,f.w,rb.dataset.s,"","",st);
    writeClip(c.ref, c.refH, `${t("copied")} (${STYLE_NAMES[st]})`);
    return;
  }
  const b = e.target.closest(".cite"); if(!b) return;
  const f = findWork(b.dataset.a,b.dataset.w); if(!f) return;
  const sec = f.w.secs.find(s=>s.id===b.dataset.s); const p = sec.paras[+b.dataset.k];
  const st = CS==="plain" ? "abnt" : CS;
  const c = citeParts(f.a,f.w,sec.id,p.ref,"",st);
  writeClip(c.ref, c.refH, `${t("copied")} (${STYLE_NAMES[st]})`);
});
/* Ctrl+C: trecho selecionado sai como citação */
document.addEventListener("copy",e=>{
  if(CS==="plain") return;
  const sel = window.getSelection(); if(!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const node = n=> n && (n.nodeType===1 ? n : n.parentElement);
  const p1 = node(range.startContainer)?.closest(".para"), p2 = node(range.endContainer)?.closest(".para");
  if(!p1 || !p2) return;
  const [aid,wid,sid] = p1.id.split(".");
  const f = findWork(aid,wid); if(!f) return;
  const frag = range.cloneContents();
  frag.querySelectorAll(".ref,.cite").forEach(x=>x.remove());
  const quote = frag.textContent.replace(/\s+/g," ").trim(); if(!quote) return;
  const r1 = p1.querySelector(".ref").textContent, r2 = p2.querySelector(".ref").textContent;
  const loc = r1===r2 ? r1 : `${r1}–${r2}`;
  const c = citeParts(f.a,f.w,sid,loc,quote,CS);
  e.clipboardData.setData("text/plain", c.inText);
  e.clipboardData.setData("text/html", c.inTextH);
  e.preventDefault();
  toast(t("copiedQ")(STYLE_NAMES[CS]));
});
/* tema claro/escuro: segue o sistema até o leitor escolher */
const root = document.documentElement, tBtn = $("#themebtn");
const isDark = ()=> root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
try{ const th = localStorage.getItem("corpus-theme"); if(th==="dark"||th==="light") root.dataset.theme = th; }catch(e){}
function themeLabel(){ const l = isDark() ? t("themeToLight") : t("themeToDark"); tBtn.title = l; tBtn.setAttribute("aria-label",l); }
tBtn.onclick = ()=>{
  root.dataset.theme = isDark() ? "light" : "dark";
  try{ localStorage.setItem("corpus-theme",root.dataset.theme); }catch(e){}
  themeLabel();
};
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",themeLabel); }catch(e){}
const sCit = $("#sel-cit");
sCit.value = CS;
sCit.onchange = ()=>{ CS = sCit.value; try{localStorage.setItem("corpus-cite",CS);}catch(e){} updateHint(); };
window.addEventListener("hashchange",route);
applyLang(); route();
</script>
