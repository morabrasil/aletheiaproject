<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F1F1F">
<meta name="description" content="aletheia project: public-domain philosophy in one place, read in the original language.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>aletheia project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Cardo:ital@0;1&family=Marcellus&display=swap">
<style>
/* Layout: reading room — fixed index on the left, one measured text column, reference pagination in the margin like a critical edition. Palette: graphite and ochre. */
:root{
  --paper:#F6F5F2;
  --sheet:#FCFBF9;
  --ink:#1E1D1B;
  --ink-soft:#615D57;
  --rule:#DDDAD4;
  --accent:#8A5A1C;
  --accent-tint:#F3E8D6;
  --mark:#F1DFA8;
  --venetian:"Venetian301 BT", "Venetian 301 BT", "Venetian 301", "Centaur MT", "Centaur";
  --display:"Libre Caslon Text", "Cardo", Georgia, serif;
  --text:"Libre Caslon Text", "Cardo", "Iowan Old Style", Georgia, serif;
  --ui:"Libre Caslon Text", "Cardo", "Iowan Old Style", Georgia, serif;
  --mono:"Libre Caslon Text", "Cardo", Georgia, serif;
  --chrome:"Marcellus", "Libre Caslon Text", Georgia, serif;
  --brand:"Libre Caslon Text", "Cardo", Georgia, serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1F1F1F; --sheet:#262625; --ink:#E4E2DE; --ink-soft:#9C9994; --rule:#383838;
  --accent:#D2A266; --accent-tint:#3A3126; --mark:#5C4A24; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#1F1F1F; --sheet:#262625; --ink:#E4E2DE; --ink-soft:#9C9994; --rule:#383838;
  --accent:#D2A266; --accent-tint:#3A3126; --mark:#5C4A24; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:17.2px;line-height:1.5;font-variant-numeric:oldstyle-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.3px solid var(--accent);outline-offset:2.3px;border-radius:1px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top-in{max-width:1380px;margin:0 auto;display:flex;align-items:center;gap:18.4px;flex-wrap:wrap;
  padding-block:11.5px;padding-left:max(18.4px,env(safe-area-inset-left,0px));padding-right:max(18.4px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-size:21.8px;font-weight:600;text-decoration:none;letter-spacing:.01em;white-space:nowrap}
.brand i{font-weight:400;color:var(--accent)}
.brand{display:flex;align-items:baseline;gap:11.5px}
.brand .wm{font-family:var(--brand);font-weight:400;font-size:24.1px;letter-spacing:.01em;line-height:1}
.brand .wm i{font-style:normal;color:var(--accent)}
.brand .gk{font-weight:400;font-style:italic;font-size:17.2px;color:var(--accent);padding-right:11.5px;border-right:1px solid var(--rule)}
@media (max-width:483px){.brand .gk{display:none}}
.search{flex:1 1 276px;min-width:0;position:relative}
.search input{width:100%;font:inherit;padding:9.2px 13.8px 9.2px 39.1px;border:1px solid var(--rule);border-radius:1px;background:var(--paper);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:12.6px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.lang{display:flex;border:1px solid var(--rule);border-radius:1px;overflow:hidden}
.lang button{background:none;border:0;padding:6.9px 11.5px;font-size:14.9px;font-weight:500;letter-spacing:.04em;color:var(--ink-soft)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--sheet)}

/* cascading picker */
.picker{border-top:1px solid var(--rule)}
.picker-in{max-width:1380px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:11.5px;align-items:end;
  padding-block:11.5px 13.8px;padding-left:max(18.4px,env(safe-area-inset-left,0px));padding-right:max(18.4px,env(safe-area-inset-right,0px))}
.fld{display:flex;flex-direction:column;gap:3.4px;min-width:0}
.fld span{font-size:12.6px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);display:flex;gap:6.9px;align-items:center}
.fld span i{font-style:normal;font-family:var(--mono);color:var(--accent)}
.fld select{appearance:none;-webkit-appearance:none;width:100%;min-width:0;font:inherit;font-size:16.1px;color:var(--ink);
  background-color:var(--paper);border:1px solid var(--rule);border-radius:1px;padding:9.2px 39.1px 9.2px 12.6px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 19.5px) 52%,calc(100% - 13.8px) 52%;background-size:5.8px 5.8px;background-repeat:no-repeat;
  text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.fld select:hover:not(:disabled){border-color:var(--ink-soft)}
.fld select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3.4px var(--accent-tint)}
.fld select:disabled{opacity:.5;cursor:not-allowed}
.go{font:inherit;font-size:16.1px;font-weight:400;letter-spacing:.06em;border:0;border-radius:1px;padding:10.3px 20.7px;background:var(--accent);color:var(--sheet);white-space:nowrap}
.go:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:874px){
  .top{position:static}
  .para{scroll-margin-top:18.4px}
  .picker-in{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .picker-in .fld:nth-child(3){grid-column:1/-1}
  .go{grid-column:1/-1}
}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:27.6px;border-top:1px solid var(--ink);padding-block:27.6px 73.6px}
.howto div{min-width:0}
.howto b{display:block;font-family:var(--display);font-weight:500;font-size:21.8px;margin-bottom:6.9px}
.howto p{margin:0;font-size:16.1px;color:var(--ink-soft)}
.howto .n{font-family:var(--mono);font-size:13.8px;color:var(--accent);margin-bottom:6.9px;display:block}
@media (max-width:874px){.howto{grid-template-columns:minmax(0,1fr)}}

.wrap{max-width:1380px;margin:0 auto;padding-left:max(18.4px,env(safe-area-inset-left,0px));padding-right:max(18.4px,env(safe-area-inset-right,0px))}

/* home */
.intro{padding-block:64.4px 36.8px;max-width:828px}
.intro h1{font-family:var(--display);font-weight:400;font-size:clamp(34.5px,5vw,52.9px);line-height:1.12;margin:0 0 18.4px;text-wrap:balance}
.intro h1 em{color:var(--accent)}
.intro p{color:var(--ink-soft);font-size:18.4px;max-width:60ch;margin:0}
.stats{margin-top:23px;font-family:var(--mono);font-size:13.8px;color:var(--ink-soft);letter-spacing:.02em}
.authors{border-top:1px solid var(--ink);margin-bottom:73.6px}
.author{display:grid;grid-template-columns:minmax(0,299px) minmax(0,1fr);gap:27.6px;padding-block:27.6px;border-bottom:1px solid var(--rule)}
.author h2{font-family:var(--display);font-weight:500;font-size:27.6px;margin:0}
.author .life{font-family:var(--mono);font-size:13.8px;color:var(--ink-soft);margin-top:4.6px}
.author .langs{font-size:13.8px;color:var(--ink-soft);margin-top:9.2px;text-transform:uppercase;letter-spacing:.08em}
.works{list-style:none;margin:0;padding:0;display:grid;gap:2.3px}
.works a{display:grid;grid-template-columns:3.5rem minmax(0,1fr);gap:13.8px;padding:9.2px 11.5px;margin-inline:-10px;border-radius:1px;text-decoration:none}
.works a:hover{background:var(--accent-tint)}
.works .yr{font-family:var(--mono);font-size:14.9px;color:var(--ink-soft);padding-top:3.4px;font-variant-numeric:tabular-nums}
.works .ot{font-family:var(--text);font-style:italic;font-size:19.5px}
.works .tt{font-size:14.9px;color:var(--ink-soft)}

/* periods (home) */
.eras{border-top:1px solid var(--ink);margin-bottom:73.6px}
.era{display:grid;grid-template-columns:minmax(0,218.5px) minmax(0,1fr) minmax(0,1.1fr) 27.6px;gap:9.2px 32.2px;align-items:baseline;
  padding:29.9px 13.8px;margin-inline:-12px;border-bottom:1px solid var(--rule);text-decoration:none;border-radius:1px;transition:background .15s}
a.era:hover{background:var(--accent-tint)}
.era .span{font-family:var(--mono);font-size:14.9px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.era h2{font-family:var(--display);font-weight:400;font-size:clamp(27.6px,3.4vw,39.1px);line-height:1.1;margin:0}
.era p{margin:6.9px 0 0;font-size:16.1px;color:var(--ink-soft)}
.era .who{font-family:var(--text);font-size:18.4px;line-height:1.5}
.era .who small{display:block;font-family:var(--ui);font-size:13.8px;color:var(--ink-soft);margin-top:4.6px;letter-spacing:.02em}
.era .arr{color:var(--accent);font-size:23px;align-self:center}
.era.off{opacity:.55}
.era.off .who{font-family:var(--ui);font-size:14.9px;color:var(--ink-soft);font-style:italic}

/* period + author pages */
.crumbs{display:flex;flex-wrap:wrap;gap:6.9px;font-size:13.8px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);padding-top:32.2px}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.phead{padding-block:16.1px 32.2px;max-width:828px}
.phead .span{font-family:var(--mono);font-size:14.9px;color:var(--ink-soft)}
.phead h1{font-family:var(--display);font-weight:400;font-size:clamp(34.5px,5vw,50.6px);line-height:1.1;margin:6.9px 0 11.5px;text-wrap:balance}
.phead p{margin:0;color:var(--ink-soft);font-size:18.4px;max-width:60ch}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(276px,1fr));gap:18.4px;border-top:1px solid var(--ink);padding-top:27.6px;margin-bottom:73.6px}
.acard{display:flex;flex-direction:column;gap:6.9px;padding:23px;border:1px solid var(--rule);border-radius:1px;background:var(--sheet);text-decoration:none;transition:border-color .15s}
.acard:hover{border-color:var(--accent)}
.acard h2{font-family:var(--display);font-weight:500;font-size:25.3px;line-height:1.2;margin:0}
.acard .life{font-family:var(--mono);font-size:13.8px;color:var(--ink-soft)}
.acard .ws{margin-top:11.5px;font-family:var(--text);font-style:italic;font-size:16.1px;color:var(--ink-soft);line-height:1.45}
.acard .foot{margin-top:auto;padding-top:13.8px;font-size:13.8px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.alist{border-top:1px solid var(--ink);padding-top:13.8px;margin-bottom:73.6px;max-width:943px}
@media (max-width:874px){
  .era{grid-template-columns:minmax(0,1fr) 27.6px}
  .era .span{grid-column:1/-1;order:-1}
  .era .who{grid-column:1/2}
  .era .arr{grid-row:2}
}

/* reader */
.reader{display:grid;grid-template-columns:333.5px minmax(0,1fr);gap:50.6px;padding-block:36.8px 92px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 172.5px);align-self:start;max-height:calc(100vh - 195.5px);overflow:auto;font-size:16.1px;overscroll-behavior:contain}
.toc-toggle{display:none}
.toc,.pane{scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color .3s}
.toc:hover,.pane:hover,.toc:focus-within,.pane:focus-within{scrollbar-color:color-mix(in srgb,var(--ink-soft) 45%,transparent) transparent}
.toc::-webkit-scrollbar,.pane::-webkit-scrollbar{width:6.9px}
.toc::-webkit-scrollbar-track,.pane::-webkit-scrollbar-track{background:transparent}
.toc::-webkit-scrollbar-thumb,.pane::-webkit-scrollbar-thumb{background:transparent;border-radius:3.4px}
.toc:hover::-webkit-scrollbar-thumb,.pane:hover::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ink-soft) 45%,transparent)}
.pane{min-width:0}
@media (min-width:990.1px){
  body.reading{overflow:hidden}
  body.reading .reader{height:calc(100dvh - var(--hdr,172.5px) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-block:0;overflow:hidden}
  body.reading .toc{position:static;height:100%;max-height:none;overflow-y:auto;padding-block:32.2px 46px;padding-right:13.8px;border-right:1px solid var(--rule)}
  body.reading .pane{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-block:32.2px 92px;padding-right:13.8px}
  body.reading .para{scroll-margin-top:27.6px}
}
.crumb{font-size:13.8px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:13.8px}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--accent)}
.toc h3{font-family:var(--display);font-weight:500;font-size:20.7px;margin:0 0 4.6px}
.toc .tree,.toc .tree ul{list-style:none;margin:0;padding:0}
.toc .tree ul{padding-left:16.1px;border-left:1px solid var(--rule);margin-left:10.3px}
.toc .tocw{margin-bottom:6.9px}
.toc .trow{display:flex;align-items:flex-start;gap:2.3px}
.toc .tw,.toc .tw-sp{flex:none;width:20.7px;height:29.9px}
.toc .tw{border:0;background:none;padding:0;color:var(--ink-soft);display:grid;place-items:center}
.toc .tw::before{content:"";width:6.9px;height:6.9px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.toc .tw[aria-expanded="true"]::before{transform:rotate(45deg)}
.toc .tw:hover{color:var(--accent)}
.toc .trow a,.toc .trow .pendt{flex:1;min-width:0;display:block;padding:4.6px 6.9px;text-decoration:none;border-radius:1px;line-height:1.35}
.toc .trow a:hover{background:var(--accent-tint)}
.toc .trow a.cur:not(.wlink){color:var(--accent);font-weight:600;background:var(--accent-tint)}
.toc .wlink{font-family:var(--text);font-style:italic;color:var(--ink-soft)}
.toc .wlink small{display:block;font-style:normal;font-size:13.8px;color:var(--ink-soft);opacity:.85}
.toc .wlink.cur{color:var(--ink);font-weight:500}
.toc .pendt{color:var(--ink-soft);opacity:.6}
.toc .pendt small{font-size:12.6px}
.tocctl{display:flex;gap:9.2px;margin:0 0 11.5px}
.tocctl button{font-family:var(--chrome);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-soft);padding:4.6px 9.2px;border-radius:1px}
.tocctl button:hover{border-color:var(--accent);color:var(--accent)}

.page{min-width:0;max-width:874px}
.whead{border-bottom:1px solid var(--rule);padding-bottom:23px;margin-bottom:32.2px}
.whead .who{font-size:14.9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft)}
.whead h1{font-family:var(--display);font-weight:400;font-style:italic;font-size:clamp(29.9px,4vw,41.4px);line-height:1.15;margin:6.9px 0 4.6px;text-wrap:balance}
.whead .trans{font-size:17.2px;color:var(--ink-soft)}
.meta{display:flex;flex-wrap:wrap;gap:6.9px 20.7px;margin-top:16.1px;font-size:14.9px;color:var(--ink-soft)}
.meta b{font-weight:600;color:var(--ink)}
.about{margin-top:16.1px;font-size:16.1px;color:var(--ink-soft);max-width:62ch}
.wmini{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:29.9px}
.wmini summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4.6px 11.5px;padding:10.3px 0;font-size:14.9px;color:var(--ink-soft)}
.wmini summary::-webkit-details-marker{display:none}
.wm-who{font-family:var(--chrome);font-size:12.6px;letter-spacing:.14em;text-transform:uppercase}
.wm-sep{opacity:.5}
.wm-t{font-family:var(--display);font-style:italic;font-size:18.4px;color:var(--ink)}
.wm-tr{font-size:14.9px}
.wm-more{margin-left:auto;font-family:var(--chrome);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6.9px}
.wm-more::after{content:"";width:6.9px;height:6.9px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.wmini[open] .wm-more::after{transform:rotate(-135deg) translateY(-2px)}
.wmini summary:hover .wm-t{color:var(--accent)}
.wmini-body{padding:6.9px 0 20.7px}
.wmini-body .meta{margin-top:0}
.sec-title{font-family:var(--display);font-weight:500;font-size:24.1px;margin:0 0 4.6px}
.sec-sub{font-size:14.9px;color:var(--ink-soft);margin:0 0 27.6px}

.para{display:grid;grid-template-columns:5.5rem minmax(0,1fr) 2rem;gap:0 16.1px;padding:6.9px 0;margin:0 -8px;padding-inline:9.2px;border-radius:1px;scroll-margin-top:195.5px}
.para .ref{font-family:var(--mono);font-size:13.8px;font-style:italic;color:var(--accent);text-align:right;padding-top:6.9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.para .tx{font-family:var(--text);font-size:19.5px;line-height:1.75;hyphens:auto;-webkit-hyphens:auto;max-width:62ch;margin:0}
.para .cite{opacity:0;align-self:start;margin-top:6.9px;border:1px solid var(--rule);background:var(--sheet);border-radius:1px;width:32.2px;height:32.2px;display:grid;place-items:center;color:var(--ink-soft);transition:opacity .15s}
.para:hover .cite,.para .cite:focus-visible{opacity:1}
.para.hit{background:var(--accent-tint)}
mark{background:var(--mark);color:inherit;border-radius:1px;padding:0 1px}
.ahead{padding-bottom:11.5px}
.astat{font-size:16.1px;color:var(--ink-soft);margin:0}
.aabout{max-width:68ch;padding-bottom:32.2px;border-bottom:1px solid var(--ink)}
.aabout p{font-family:var(--text);font-size:18.4px;line-height:1.7;margin:0 0 13.8px}
.aabout .atext{font-size:16.1px;color:var(--ink-soft);font-style:italic}
.agroup{padding-block:25.3px 6.9px;border-bottom:1px solid var(--rule)}
.agroup h2{font-family:var(--chrome);font-weight:400;font-size:14.9px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 11.5px}
.agroup h2 small{font-family:var(--text);font-size:16.1px;letter-spacing:0;text-transform:none;color:var(--ink-soft);font-style:italic;margin-left:9.2px}
.wlist{list-style:none;margin:0;padding:0}
.wrow{display:grid;grid-template-columns:minmax(0,15rem) minmax(0,1fr) auto;gap:4.6px 27.6px;align-items:baseline;padding:11.5px 9.2px;margin-inline:-8px;text-decoration:none;border-radius:1px}
.wrow:hover{background:var(--accent-tint)}
.wt{display:flex;flex-direction:column;min-width:0}
.wt .ot{font-family:var(--text);font-size:19.5px}
.wt .tt{font-size:14.9px;color:var(--ink-soft)}
.wb{font-family:var(--text);font-size:17.2px;line-height:1.5;color:var(--ink)}
.wm{font-size:13.8px;color:var(--ink-soft);white-space:nowrap;font-style:italic}
@media (max-width:874px){.wrow{grid-template-columns:minmax(0,1fr)}.wm{white-space:normal}}
.approx{text-decoration:underline dotted;text-underline-offset:3.4px;cursor:help}
.sperr{letter-spacing:.12em}
.k-h .tx{font-family:var(--display);font-weight:700;font-size:19.5px;text-align:center;letter-spacing:.01em}
.k-n .tx{font-size:17.2px;line-height:1.6;color:var(--ink-soft);border-left:2.3px solid var(--rule);padding-left:13.8px}
.k-i .tx{padding-left:1.5em;text-indent:-1em}
.spk{font-size:.82em;letter-spacing:.06em;color:var(--accent);margin-right:.2em}

.pend{border:1px dashed var(--rule);border-radius:1px;padding:23px;color:var(--ink-soft);font-size:16.1px}

.pager a{text-decoration:none;color:var(--accent);max-width:48%}
.pager a small{display:block;color:var(--ink-soft);font-size:13.8px;text-transform:uppercase;letter-spacing:.06em}
.note{font-size:13.8px;color:var(--ink-soft);margin-top:32.2px;font-style:italic}

/* search */
.sres{padding-block:36.8px 92px;max-width:943px}
.sres h1{font-family:var(--display);font-weight:400;font-size:32.2px;margin:0 0 6.9px}
.sres .hint{color:var(--ink-soft);font-size:16.1px;margin:0 0 20.7px}
.chips{display:flex;flex-wrap:wrap;gap:9.2px;margin-bottom:25.3px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:1px;padding:4.6px 13.8px;font-size:14.9px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.res{display:block;text-decoration:none;padding:16.1px 0;border-bottom:1px solid var(--rule)}
.res .where{font-size:13.8px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.res .where b{color:var(--accent);font-family:var(--mono);font-weight:500;text-transform:none;letter-spacing:0}
.res .snip{font-family:var(--text);font-size:18.4px;line-height:1.6;margin-top:4.6px}
.res:hover .snip{color:var(--accent)}
.try{display:flex;gap:9.2px;flex-wrap:wrap;font-size:14.9px;color:var(--ink-soft);align-items:center}
.try button{border:1px solid var(--rule);background:var(--sheet);border-radius:1px;padding:2.3px 9.2px;font-family:var(--text);font-style:italic}

.themebtn{display:grid;place-items:center;width:39.1px;height:36.8px;border:1px solid var(--rule);border-radius:1px;background:var(--paper);color:var(--ink)}
.themebtn:hover{border-color:var(--ink-soft)}
.themebtn .moon{display:none}
:root[data-theme="dark"] .themebtn .sun{display:none}
:root[data-theme="dark"] .themebtn .moon{display:block}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .themebtn .sun{display:none} :root:not([data-theme="light"]) .themebtn .moon{display:block} }
.citesel{display:flex;align-items:center;gap:6.9px;font-size:13.8px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.citesel select{appearance:none;-webkit-appearance:none;font:inherit;font-size:14.9px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);
  background-color:var(--paper);border:1px solid var(--rule);border-radius:1px;padding:6.9px 29.9px 6.9px 11.5px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 14.9px) 52%,calc(100% - 9.2px) 52%;background-size:5.8px 5.8px;background-repeat:no-repeat}
.citesel select:focus{outline:none;border-color:var(--accent)}
.copyhint{display:flex;gap:9.2px;align-items:flex-start;margin-top:18.4px;padding:11.5px 13.8px;border-radius:1px;background:var(--accent-tint);font-size:14.9px;color:var(--ink)}
.copyhint kbd{font-family:var(--mono);font-size:12.6px;border:1px solid var(--rule);border-bottom-width:2.3px;border-radius:1px;padding:0 4.6px;background:var(--sheet)}
.copyhint b{color:var(--accent)}
.copyhint{flex-wrap:wrap;align-items:center}
.refbox{margin-top:23px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:16.1px}
.refhead{display:flex;justify-content:space-between;align-items:center;gap:13.8px;flex-wrap:wrap;margin-bottom:11.5px}
#reftitle{font-family:var(--chrome);font-size:12.6px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
#reftitle b{font-weight:400;color:var(--accent)}
.reftext{font-family:var(--text);font-size:17.2px;line-height:1.6;padding-left:2em;text-indent:-2em;overflow-wrap:anywhere;user-select:all}
.reftext p{margin:0 0 6.9px}
.reftext i{font-style:italic}
.refhint{margin:13.8px 0 0;font-size:14.9px;color:var(--ink-soft)}
.refhint kbd{font-family:var(--mono);font-size:13.8px;border:1px solid var(--rule);border-bottom-width:2.3px;padding:0 4.6px;background:var(--sheet)}
.refhint b{font-weight:400;color:var(--accent)}
.refbtn{font-family:var(--chrome)!important;font-size:13.8px!important;font-weight:400!important;letter-spacing:.12em;text-transform:uppercase;padding:6.9px 13.8px!important}
.refbtn{font:inherit;font-size:14.9px;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:var(--sheet);border-radius:1px;padding:6.9px 13.8px;white-space:nowrap}
.refbtn:hover{background:var(--accent);color:var(--sheet)}
.toast{white-space:pre-line;text-align:left}
.toast{position:fixed;left:50%;bottom:calc(23px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11.5px 18.4px;border-radius:1px;font-size:14.9px;max-width:calc(100% - 36.8px)}

@media (max-width:989px){
  .reader{grid-template-columns:minmax(0,1fr);gap:23px;padding-top:23px}
  .toc{position:static;max-height:none;border:1px solid var(--rule);border-radius:1px;padding:13.8px;background:var(--sheet)}

  .author{grid-template-columns:minmax(0,1fr);gap:13.8px}

   { id:"aufkl", title:"Beantwortung der Frage: Was ist Aufklärung?", tr:{pt:"Resposta à pergunta: Que é Esclarecimento?",en:"An Answer to the Question: What Is Enlightenment?"},
     year:"1784", pub:"Berlinische Monatsschrift, Dez. 1784", base:{pt:"Akademie-Ausgabe, Bd. VIII (grafia modernizada)",en:"Akademie-Ausgabe, vol. VIII (modernized spelling)"}, refsys:"AA",
     about:{pt:"Ensaio curto; cita-se pelo volume e página da Akademie-Ausgabe.",en:"Short essay; cited by Akademie-Ausgabe volume and page."},
     secs:[
      {id:"text", title:"Text", tr:{pt:"Texto",en:"Text"}, paras:[
        P("AA VIII, 35","Aufklärung ist der Ausgang des Menschen aus seiner selbstverschuldeten Unmündigkeit. Unmündigkeit ist das Unvermögen, sich seines Verstandes ohne Leitung eines anderen zu bedienen. Selbstverschuldet ist diese Unmündigkeit, wenn die Ursache derselben nicht am Mangel des Verstandes, sondern der Entschließung und des Mutes liegt, sich seiner ohne Leitung eines andern zu bedienen. Sapere aude! Habe Mut, dich deines eigenen Verstandes zu bedienen! ist also der Wahlspruch der Aufklärung."),
        P("AA VIII, 35","Faulheit und Feigheit sind die Ursachen, warum ein so großer Teil der Menschen, nachdem sie die Natur längst von fremder Leitung freigesprochen (naturaliter maiorennes), dennoch gerne zeitlebens unmündig bleiben; und warum es anderen so leicht wird, sich zu deren Vormündern aufzuwerfen. Es ist so bequem, unmündig zu sein. Habe ich ein Buch, das für mich Verstand hat, einen Seelsorger, der für mich Gewissen hat, einen Arzt, der für mich die Diät beurteilt, usw., so brauche ich mich ja nicht selbst zu bemühen. Ich habe nicht nötig zu denken, wenn ich nur bezahlen kann; andere werden das verdrießliche Geschäft schon für mich übernehmen.")]}
     ]}
 ]},

   { id:"phg", title:"Phänomenologie des Geistes", tr:{pt:"Fenomenologia do Espírito",en:"Phenomenology of Spirit"},
     year:"1807", pub:"Bamberg/Würzburg 1807", base:{pt:"1ª edição (grafia modernizada)",en:"1st edition (modernized spelling)"}, refsys:"¶",

     secs:[
      {id:"vorr", title:"Vorrede", tr:{pt:"Prefácio",en:"Preface"}, paras:[
        P("¶ 2","Die Knospe verschwindet in dem Hervorbrechen der Blüte, und man könnte sagen, daß jene von dieser widerlegt wird; ebenso wird durch die Frucht die Blüte für ein falsches Dasein der Pflanze erklärt, und als ihre Wahrheit tritt diese an die Stelle von jener. Diese Formen unterscheiden sich nicht nur, sondern verdrängen sich auch als unverträglich miteinander. Aber ihre flüssige Natur macht sie zugleich zu Momenten der organischen Einheit, worin sie sich nicht nur nicht widerstreiten, sondern eins so notwendig als das andere ist, und diese gleiche Notwendigkeit macht erst das Leben des Ganzen aus."),
        P("¶ 17","Es kommt nach meiner Einsicht, welche sich durch die Darstellung des Systems selbst rechtfertigen muß, alles darauf an, das Wahre nicht als Substanz, sondern ebensosehr als Subjekt aufzufassen und auszudrücken."),
        P("¶ 20","Das Wahre ist das Ganze. Das Ganze aber ist nur das durch seine Entwicklung sich vollendende Wesen. Es ist von dem Absoluten zu sagen, daß es wesentlich Resultat, daß es erst am Ende das ist, was es in Wahrheit ist; und hierin eben besteht seine Natur, Wirkliches, Subjekt oder Sichselbstwerden zu sein.")]},

function citeParts(a,w,secId,locator,quote,style){
  const n = NAMES[a.id], b = BIB[`${a.id}.${w.id}`] || {orig:loc(w.year), origEn:loc(w.year)};
  const title = b.title || w.title;
  const url = `${BASE_URL}#${a.id}.${w.id}.${secId}`;
  const d = new Date(), y = d.getFullYear();
  const accPt = `${d.getDate()} ${MPT[d.getMonth()]} ${y}`, accEn = `${d.getDate()} ${MEN[d.getMonth()]} ${y}`;
  const ed = b.ed;
  const long = quote && quote.length > 240;
  const I = s=>`<i>${esc(s)}</i>`;
  let inText="", inTextH="", ref="", refH="", label="";
  if(style==="abnt"){
    label = "Referência";
    const call = `(${n.ptLast}, ${b.orig}, ${locator})`;
    if(quote){ inText = long ? `${quote} ${call}.` : `“${quote}” ${call}.`;
      inTextH = long ? `<p style="margin-left:4cm;font-size:10pt;line-height:1">${esc(quote)} ${esc(call)}.</p>` : `<p>“${esc(quote)}” ${esc(call)}.</p>`; }
    const edT = ed ? `${ed.note?ed.note+". ":""}${ed.place}: ${ed.pub}, ${ed.year}. ` : "";
    ref = `${n.abnt}. ${title}. ${edT}In: ${SITE}. Disponível em: ${url}. Acesso em: ${accPt}.`;
    refH = `${esc(n.abnt)}. <b>${esc(title)}</b>. ${esc(edT)}In: ${esc(SITE)}. Disponível em: ${esc(url)}. Acesso em: ${accPt}.`;
  } else if(style==="apa"){
    label = "Reference";
    const call = `(${n.enLast}, ${b.origEn}/${y}, ${locator})`;
    if(quote){ inText = long ? `${quote} ${call}` : `"${quote}" ${call}.`;
      inTextH = long ? `<p style="margin-left:0.5in">${esc(quote)} ${esc(call)}</p>` : `<p>"${esc(quote)}" ${esc(call)}.</p>`; }
    ref = `${n.apa} (${y}). ${title}. ${SITE}. ${url} (Original work published ${b.origEn})`;
    refH = `${esc(n.apa)} (${y}). ${I(title)}. ${esc(SITE)}. ${esc(url)} (Original work published ${esc(b.origEn)})`;
  } else if(style==="chicago"){
    label = "Reference List";
    const call = `(${n.enLast} ${b.origEn}, ${locator})`;
    if(quote){ inText = long ? `${quote} ${call}` : `“${quote}” ${call}.`;
      inTextH = long ? `<p style="margin-left:0.5in">${esc(quote)} ${esc(call)}</p>` : `<p>“${esc(quote)}” ${esc(call)}.</p>`; }
    const pubT = ed ? ` ${ed.place}: ${ed.pub}.` : "";
    ref = `${n.inv}. ${b.origEn}. ${title}.${pubT} ${SITE}. ${url}.`;
    refH = `${esc(n.inv)}. ${esc(b.origEn)}. ${I(title)}.${esc(pubT)} ${esc(SITE)}. ${esc(url)}.`;
  } else if(style==="mla"){
    label = "Works Cited";
    const call = `(${n.enLast} ${locator})`;
    if(quote){ inText = long ? `${quote} ${call}` : `“${quote}” ${call}.`;
      inTextH = long ? `<p style="margin-left:0.5in">${esc(quote)} ${esc(call)}</p>` : `<p>“${esc(quote)}” ${esc(call)}.</p>`; }
    ref = `${n.inv}. ${title}. ${b.origEn}. ${SITE}, ${url}. Accessed ${accEn}.`;
    refH = `${esc(n.inv)}. ${I(title)}. ${esc(b.origEn)}. ${I(SITE)}, ${esc(url)}. Accessed ${accEn}.`;
  }
  return {inText, inTextH, ref, refH:refH.startsWith("<p>")?refH:`<p>${refH}</p>`, label};
}

const TOC_OPEN = new Set();
function buildTree(secs){
  const root = {kids:[], level:0}, stack = [root];
  for(const s of secs){
    const lv = s.level || 1;
    while(stack.length>1 && stack[stack.length-1].level >= lv) stack.pop();
    const n = {s, kids:[], level:lv};
    stack[stack.length-1].kids.push(n); stack.push(n);
  }
  return root.kids;
}

const loading = new Map();
function loadWork(w){
  if(!w.src || w.loaded) return Promise.resolve(w);
  if(loading.has(w)) return loading.get(w);
  const pr = fetch(w.src).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(d=>{
    d.secs.forEach(ds=>{
      const sec = w.secs.find(x=>x.id===ds.id);
      if(sec) sec.paras = ds.paras.map(p=>({ref:p[0], sp:p[1], t:p[2]}));
    });
    w.loaded = true; return w;
  }).finally(()=>loading.delete(w));
  loading.set(w,pr); return pr;
}

/* ---------- home: periods ---------- */
const authorsOf = pid=>DATA.filter(a=>a.period===pid);
const worksCount = list=>list.reduce((n,a)=>n+a.works.length,0);
function renderHome(){
  app.innerHTML = `
    <section class="intro">
      <h1>${t("h1")}</h1>
      <p>${t("lead")}</p>
      <div class="stats">${t("stats")(DATA.length,worksCount(DATA))} · ${t("choose2")}</div>
    </section>
    <section class="howto">
      ${t("how").map((h,i)=>`<div><span class="n">${i+1}</span><b>${h[0]}</b><p>${h[1]}</p></div>`).join("")}
    </section>`;
}

/* ---------- cascading dropdowns ---------- */
const sPer = $("#sel-per"), sAut = $("#sel-aut"), sObr = $("#sel-obr"), bGo = $("#go");
const opt = (v,label,dis=false)=>`<option value="${v}"${dis?" disabled":""}>${esc(label)}</option>`;
function fillPer(v){
  sPer.innerHTML = opt("",t("pickPer")) + PERIODS.map(p=>{
    const n = authorsOf(p.id).length;
    return opt(p.id, n ? `${p.name[L]} (${p.span[L]})` : `${p.name[L]} — ${t("pending")}`, !n);
  }).join("");
  sPer.value = v||"";
}
function fillAut(v){
  const as = sPer.value ? authorsOf(sPer.value) : [];
  sAut.innerHTML = opt("",t("pickAut")) + as.map(a=>opt(a.id,`${aName(a)} (${loc(a.life)})`)).join("");
  sAut.disabled = !as.length; sAut.value = v||"";
}
function fillObr(v){
  const a = DATA.find(x=>x.id===sAut.value);
  sObr.innerHTML = opt("",t("pickObr")) + (a?a.works.map(w=>opt(w.id,`${w.title} (${loc(w.year)})`)).join(""):"");
  sObr.disabled = !a; sObr.value = v||"";
  bGo.disabled = !sObr.value;
}
function syncPicker(per,aut,obr){ fillPer(per); fillAut(aut); fillObr(obr); }
sPer.onchange = ()=>{ fillAut(""); fillObr(""); sAut.focus(); };
sAut.onchange = ()=>{ fillObr(""); if(sAut.value) go(sAut.value); sObr.focus(); };
sObr.onchange = ()=>{ bGo.disabled = !sObr.value; };
bGo.onclick = ()=>{
  const f = findWork(sAut.value,sObr.value); if(!f) return;
  go(`${f.a.id}.${f.w.id}.${firstSec(f.w).id}`);
};

/* ---------- author page: works ---------- */
function renderAuthor(a){
  const p = PERIODS.find(x=>x.id===a.period);
  const info = AUTHOR_INFO[a.id] || {};
  const byId = Object.fromEntries(a.works.map(w=>[w.id,w]));
  const groups = info.groups || [{title:{pt:t("inCollection"),en:t("inCollection")}, works:a.works.map(w=>w.id)}];
  const full = a.works.some(w=>w.src);
  const row = w=>{
    const r = info.range && info.range[w.id];
    const nsec = w.secs.filter(s=>hasText(w,s)).length;
    const parts = w.secs.length>1 ? t("partsN")(w.secs.length, w.secs[0].id[0]) : "";
    const b = info.blurb && info.blurb[w.id];
    return `<li><a class="wrow" href="#${a.id}.${w.id}.${firstSec(w).id}">
      <span class="wt"><span class="ot" lang="${a.lang}">${esc(w.title)}</span><span class="tt">${esc(w.tr[L])}</span></span>
      ${b?`<span class="wb">${esc(b[L])}</span>`:""}
      <span class="wm">${[r?`${esc(loc(w.refsys))} ${r[0]}–${r[1]}`:"", parts, w.src||nsec===w.secs.length?"":t("excerpt")].filter(Boolean).join(" · ")}</span>
    </a></li>`;
  };
  app.innerHTML = `
    <div class="crumbs"><a href="#">${t("library")}</a><span>›</span><a href="#${p.id}">${p.name[L]}</a><span>›</span><span>${esc(aName(a))}</span></div>
    <header class="phead ahead">
      <div class="span">${loc(a.life)} · ${UI[L].langs[a.lang]}</div>
      <h1>${esc(aName(a))}</h1>
      <p class="astat">${t("worksN")(a.works.length)} · ${a.works.every(w=>w.src) ? t("completeTxt") : full ? t("mixTxt")(a.works.filter(w=>w.src).length) : t("partialTxt")}</p>
    </header>
    <section class="aabout">
      ${(info.about ? info.about[L] : []).map(x=>`<p>${esc(x)}</p>`).join("")}
      ${info.text ? `<p class="atext">${esc(info.text[L])}</p>` : ""}
    </section>
    ${groups.map(g=>`<section class="agroup">
      <h2>${esc(g.title[L])}${g.note?` <small>${esc(g.note[L])}</small>`:""}</h2>
      <ul class="wlist">${g.works.map(id=>byId[id]).filter(Boolean).map(row).join("")}</ul>
    </section>`).join("")}`;
  window.scrollTo(0,0);
}

/* ---------- reader ---------- */
function renderReader(aid,wid,sid,pid){
  const f = findWork(aid,wid); if(!f) return renderHome();
  const {a,w} = f;
  const sec = w.secs.find(s=>s.id===sid) || firstSec(w);
  const avail = w.secs.filter(s=>hasText(w,s));
  const i = avail.indexOf(sec);
  const prev = i>0 ? avail[i-1] : null, next = i>=0 && i<avail.length-1 ? avail[i+1] : null;

  /* sidebar: collapsible tree of works and their sections */
  const curKey = `${a.id}.${w.id}`;
  TOC_OPEN.add(curKey);
  const tree = buildTree(w.secs);
  (function openAncestors(nodes, path){
    for(const n of nodes){
      const p = path.concat(n);
      if(n.s===sec){ p.slice(0,-1).forEach(x=>TOC_OPEN.add(`${curKey}.${x.s.id}`)); return true; }
      if(openAncestors(n.kids,p)) return true;
    }
    return false;
  })(tree,[]);
  const nodeHTML = (ww,n)=>{
    const key = `${a.id}.${ww.id}.${n.s.id}`, open = TOC_OPEN.has(key), has = n.kids.length>0;
    const label = hasText(ww,n.s)
      ? `<a href="#${a.id}.${ww.id}.${n.s.id}" class="${n.s===sec?"cur":""}" lang="${a.lang}">${esc(n.s.title)}</a>`
      : `<span class="pendt" lang="${a.lang}">${esc(n.s.title)} <small>· ${t("pending")}</small></span>`;
    return `<li><div class="trow">${has?`<button class="tw" data-k="${key}" aria-expanded="${open}" aria-label="${t(open?"collapse":"expand")}"></button>`:`<span class="tw-sp"></span>`}${label}</div>
      ${has?`<ul ${open?"":"hidden"}>${n.kids.map(k=>nodeHTML(ww,k)).join("")}</ul>`:""}</li>`;
  };
  const workHTML = ww=>{
    const key = `${a.id}.${ww.id}`, open = TOC_OPEN.has(key), many = ww.secs.length>1;
    return `<li class="tocw${ww===w?" curw":""}"><div class="trow">${many?`<button class="tw" data-k="${key}" aria-expanded="${open}" aria-label="${t(open?"collapse":"expand")}"></button>`:`<span class="tw-sp"></span>`}<a href="#${a.id}.${ww.id}.${firstSec(ww).id}" class="wlink${ww===w?" cur":""}" lang="${a.lang}">${esc(ww.title)}<small>${esc(ww.tr[L])}</small></a></div>
      ${many?`<ul ${open?"":"hidden"}>${buildTree(ww.secs).map(n=>nodeHTML(ww,n)).join("")}</ul>`:""}</li>`;
  };
  const toc = `
    <aside class="toc ${tocOpen?"":"closed"}" id="toc">
      <button class="toc-toggle" id="tocbtn" aria-expanded="${tocOpen}"><span>${t("contents")}</span><span aria-hidden="true">${tocOpen?"−":"+"}</span></button>
      <div class="toc-body">
        <div class="crumb"><a href="#">${t("library")}</a> › <a href="#${a.period}">${PERIODS.find(x=>x.id===a.period).name[L]}</a></div>
        <h3><a href="#${a.id}" style="text-decoration:none">${esc(aName(a))}</a></h3>
        <div class="life" style="font-family:var(--mono);font-size:16px;color:var(--ink-soft);margin-bottom:12px">${loc(a.life)}</div>
        <div class="tocctl"><button id="tocall">${t("expandAll")}</button><button id="tocnone">${t("collapseAll")}</button></div>
        <ul class="tree">${a.works.map(workHTML).join("")}</ul>
      </div>
    </aside>`;

  if(w.src && !w.loaded){
    loadWork(w).then(()=>{ if(location.hash.slice(1).startsWith(`${a.id}.${w.id}`) || !location.hash) route(); })
      .catch(()=>{ const el=document.getElementById("loadmsg"); if(el) el.textContent=t("loadFail"); });
  }
  const body = (w.src && !w.loaded)
    ? `<div class="pend" id="loadmsg">${t("loadingWork")}</div>`
    : sec.paras
    ? sec.paras.map((p,k)=>{
        const id = `${a.id}.${w.id}.${sec.id}.p${k+1}`;
        return `<div class="para${paraKind(p,w)} ${pid===`p${k+1}`?"hit":""}" id="${id}">
          <span class="ref${p.ref.endsWith("~")?" approx":""}"${p.ref.endsWith("~")?` title="${esc(t("approxPg"))}"`:""}>${esc(p.ref.replace(/~$/,""))}</span>
          <p class="tx" lang="${a.lang}">${fmtPara(p,w)}</p>
          <button class="cite" data-a="${a.id}" data-w="${w.id}" data-s="${sec.id}" data-k="${k}" title="${t("cite")}" aria-label="${t("cite")}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          </button></div>`;}).join("")
    : `<div class="pend">${t("pendBody")}</div>`;

  const isFirst = avail.indexOf(sec) <= 0;
  const headTop = `<div class="who">${esc(aName(a))}</div>
        <h1 lang="${a.lang}">${esc(w.title)}</h1>
        <div class="trans">${esc(w.tr[L])}</div>`;
  const origLine = w.origTitle ? `<span><b>${t("origTitle")}</b> <i lang="${a.lang}">${esc(w.origTitle)}</i></span>` : "";
  const headInfo = `<div class="meta">
          ${origLine}
          <span><b>${t("published")}</b> ${esc(loc(w.pub))}</span>
          <span><b>${t("base")}</b> ${esc(loc(w.base))}</span>
          <span><b>${t("lang")}</b> ${UI[L].langs[a.lang]}</span>
          <span><b>${t("refsys")}</b> ${esc(loc(w.refsys))}</span>
        </div>
        <p class="about">${esc(w.about[L])}</p>
        <section class="refbox" aria-labelledby="reftitle">
          <div class="refhead"><span id="reftitle"></span>
            <button class="refbtn" id="refbtn" data-a="${a.id}" data-w="${w.id}" data-s="${sec.id}"></button></div>
          <div class="reftext" id="reftext" data-a="${a.id}" data-w="${w.id}" data-s="${sec.id}"></div>
          <p class="refhint" id="copyhint"></p>
        </section>`;
  app.innerHTML = `<div class="reader">${toc}
    <div class="pane" id="pane"><article class="page">
      ${isFirst ? `<header class="whead">${headTop}${headInfo}</header>` : `
      <details class="wmini">
        <summary><span class="wm-who">${esc(aName(a))}</span><span class="wm-sep">·</span><span class="wm-t" lang="${a.lang}">${esc(w.title)}</span><span class="wm-tr">${esc(w.tr[L])}</span><span class="wm-more">${t("aboutCite")}</span></summary>
        <div class="wmini-body">${headInfo}</div>
      </details>`}
      <h2 class="sec-title" lang="${a.lang}">${esc(sec.title)}</h2>
      ${sec.tr?`<p class="sec-sub">${esc(sec.tr[L])}</p>`:`<p class="sec-sub"></p>`}
      ${body}
      <nav class="pager">
        ${prev?`<a href="#${a.id}.${w.id}.${prev.id}"><small>← ${t("prev")}</small><span lang="${a.lang}">${esc(prev.title)}</span></a>`:"<span></span>"}
        ${next?`<a href="#${a.id}.${w.id}.${next.id}" style="text-align:right"><small>${t("next")} →</small><span lang="${a.lang}">${esc(next.title)}</span></a>`:"<span></span>"}
      </nav>
      <p class="note">${w.src ? t("fullNote") : t("note")}</p>
    </article></div></div>`;

  updateHint();
  $("#tocbtn").onclick = ()=>{ tocOpen=!tocOpen; route(); };
  const tocEl = $("#toc");
  tocEl.addEventListener("click",e=>{
    const b = e.target.closest(".tw"); if(!b) return;
    const ul = b.closest("li").querySelector(":scope > ul"); if(!ul) return;
    const open = ul.hidden; ul.hidden = !open;
    b.setAttribute("aria-expanded", open); b.setAttribute("aria-label", t(open?"collapse":"expand"));
    open ? TOC_OPEN.add(b.dataset.k) : TOC_OPEN.delete(b.dataset.k);
  });
  const setAll = open=>{
    tocEl.querySelectorAll(".curw .tw").forEach(b=>{
      const ul = b.closest("li").querySelector(":scope > ul"); if(!ul) return;
      ul.hidden = !open; b.setAttribute("aria-expanded",open); b.setAttribute("aria-label",t(open?"collapse":"expand"));
      open ? TOC_OPEN.add(b.dataset.k) : TOC_OPEN.delete(b.dataset.k);
    });
  };
  $("#tocall").onclick = ()=>setAll(true);
  $("#tocnone").onclick = ()=>{ setAll(false); const wb = tocEl.querySelector(".curw > .trow .tw"); if(wb){ const ul=wb.closest("li").querySelector(":scope > ul"); ul.hidden=false; wb.setAttribute("aria-expanded",true); TOC_OPEN.add(wb.dataset.k);} };
  const curA = tocEl.querySelector(".tree a.cur:not(.wlink)") || tocEl.querySelector(".tree a.cur");
  if(curA && window.matchMedia("(min-width: 861px)").matches){ try{ const r=curA.getBoundingClientRect(), tr=tocEl.getBoundingClientRect(); if(r.top<tr.top||r.bottom>tr.bottom) tocEl.scrollTop += r.top - tr.top - tr.height/3; }catch(err){} }
  if(pid){ const el = document.getElementById(`${a.id}.${w.id}.${sec.id}.${pid}`); if(el) requestAnimationFrame(()=>el.scrollIntoView({block:"center"})); }
  else { window.scrollTo(0,0); const pn=document.getElementById("pane"); if(pn) pn.scrollTop=0; }
}

function cite(a,w,p){
  const last = aShort(a);
  return `${last}, ${w.title}, ${p.ref}.`;
}

/* ---------- search ---------- */
function norm(s){
  return s.toLowerCase().replace(/ς/g,"σ").replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/th/g,"t").replace(/ey/g,"ei").replace(/y/g,"i")
    .replace(/ck/g,"k").replace(/c(?=[eiäö])/g,"z").replace(/c(?!h)/g,"k")
    .replace(/([a-z])\1+/g,"$1").replace(/[^\p{L}\p{N}\s]/gu," ");
}
function highlight(text,terms){
  return text.split(/(\s+)/).map(tok=>{
    if(/^\s+$/.test(tok)) return tok;
    const n = norm(tok);
    return terms.some(q=>n.includes(q)) ? `<mark>${esc(tok)}</mark>` : esc(tok);
  }).join("");
}
const MAXHITS = 200;
function snippet(text,terms){
  const toks = plain(text).split(/(\s+)/);
  let hit = toks.findIndex(tok=>!/^\s+$/.test(tok) && terms.some(q=>norm(tok).includes(q)));
  if(hit<0) hit = 0;
  const from = Math.max(0,hit-40), to = Math.min(toks.length,hit+70);
  return (from>0?"… ":"") + highlight(toks.slice(from,to).join(""),terms) + (to<toks.length?" …":"");
}
function renderSearch(){
  const raw = $("#q").value.trim();
  const terms = norm(raw).split(/\s+/).filter(x=>x.length>1);
  const scope = DATA.filter(a=>filterAuthor==="all" || filterAuthor===a.id);
  const pending = terms.length ? scope.flatMap(a=>a.works).filter(w=>w.src && !w.loaded) : [];
  if(pending.length){
    app.innerHTML = `<section class="sres"><h1>${t("sres")} · <i>${esc(raw)}</i></h1><p class="hint">${t("loadingAll")}</p></section>`;
    Promise.all(pending.map(loadWork)).then(()=>{ if(location.hash==="#busca") renderSearch(); })
      .catch(()=>{ app.querySelector(".hint").textContent = t("loadFail"); });
    return;
  }
  const hits = [];
  if(terms.length) scope.forEach(a=>{
    a.works.forEach(w=>w.secs.forEach(s=>(s.paras||[]).forEach((p,k)=>{
      const n = norm(plain(p.t));
      if(terms.every(q=>n.includes(q))) hits.push({a,w,s,p,k});
    })));
  });
  const samples = ["ἀλήθεια","ψυχή","Vernunft","Ware","substantia"];
  app.innerHTML = `<section class="sres">
    <h1>${t("sres")}${raw?` · <i style="font-style:italic">${esc(raw)}</i>`:""}</h1>
    <p class="hint">${t("hintS")}</p>
    <div class="chips" role="group">
      <button class="chip" data-f="all" aria-pressed="${filterAuthor==="all"}">${t("all")}</button>
      ${DATA.map(a=>`<button class="chip" data-f="${a.id}" aria-pressed="${filterAuthor===a.id}">${esc(aShort(a))}</button>`).join("")}
    </div>
    ${terms.length
      ? `<div class="hint" style="font-family:var(--mono);font-size:12px">${t("found")(hits.length)}</div>
         ${hits.length? hits.slice(0,MAXHITS).map(h=>`<a class="res" href="#${h.a.id}.${h.w.id}.${h.s.id}.p${h.k+1}">
            <div class="where">${esc(aShort(h.a))} · <span lang="${h.a.lang}" style="text-transform:none;font-style:italic">${esc(h.w.title)}</span> · <b>${esc(h.p.ref)}</b></div>
            <div class="snip" lang="${h.a.lang}">${snippet(h.p.t,terms)}</div></a>`).join("") + (hits.length>MAXHITS?`<p class="hint">${t("moreHits")(MAXHITS)}</p>`:"") : `<p>${t("none")}</p>`}`
      : `<div class="try">${t("tryit")} ${samples.map(s=>`<button data-try="${s}">${s}</button>`).join("")}</div>`}
  </section>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filterAuthor=b.dataset.f;renderSearch();});
  app.querySelectorAll("[data-try]").forEach(b=>b.onclick=()=>{$("#q").value=b.dataset.try;go("busca");});
}

/* ---------- two independent scroll areas while reading (wide screens) ---------- */
function measureHeader(){
  const top = document.querySelector(".top");
  if(top) document.documentElement.style.setProperty("--hdr", top.getBoundingClientRect().height + "px");
}
window.addEventListener("resize", measureHeader);
try{ new ResizeObserver(measureHeader).observe(document.querySelector(".top")); }catch(e){}

/* ---------- routing ---------- */
function go(h){ if(location.hash.slice(1)===h) route(); else location.hash = h; }
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  const reading = h.split(".").length>=2 && h!=="busca";
  document.body.classList.toggle("reading", reading);
  measureHeader();
  if(h==="busca"){ renderSearch(); return; }
  const parts = h.split(".");
  const au = DATA.find(a=>a.id===parts[0]);
  if(parts.length>=2 && au){ syncPicker(au.period,au.id,parts[1]); return renderReader(parts[0],parts[1],parts[2],parts[3]); }
  const per = PERIODS.find(p=>p.id===h);
  if(per && authorsOf(per.id).length){ syncPicker(per.id,"",""); return renderPeriod(per); }
  if(au){ syncPicker(au.period,au.id,""); return renderAuthor(au); }
  syncPicker("","",""); renderHome(); window.scrollTo(0,0);
}
function applyLang(){
  document.documentElement.lang = L==="pt"?"pt-BR":"en";
  $("#q").placeholder = t("search");
  $("#lb-per").textContent = t("lPer"); $("#lb-aut").textContent = t("lAut"); $("#lb-obr").textContent = t("lObr");
  bGo.textContent = t("read") + " →";
  $("#lb-cit").textContent = t("citLbl");
  themeLabel();
  sCit.querySelector('[value="plain"]').textContent = t("plain");
  updateHint();
  $("#lang-pt").setAttribute("aria-pressed",L==="pt");
  $("#lang-en").setAttribute("aria-pressed",L==="en");
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{
  L=b.dataset.l; try{localStorage.setItem("corpus-lang",L);}catch(e){}
  applyLang(); route();
});
let qTimer;
$("#q").addEventListener("input",()=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>go("busca"),180); });
$("#q").addEventListener("keydown",e=>{ if(e.key==="Enter") go("busca"); });

let toastTimer;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true,2600); }
function updateHint(){
  const h = document.getElementById("copyhint"); if(!h) return;
  const st = CS==="plain" ? "abnt" : CS;
  h.innerHTML = CS==="plain" ? t("hintPlain") : t("hint")(STYLE_NAMES[CS]);
  const rt = document.getElementById("reftext");
  if(rt){
    const f = findWork(rt.dataset.a,rt.dataset.w);
    if(f) rt.innerHTML = citeParts(f.a,f.w,rt.dataset.s,"","",st).refH;
  }
  const tt = document.getElementById("reftitle");
  if(tt) tt.innerHTML = `${t("refTitle")} · <b>${STYLE_NAMES[st]}</b>`;
  const rb = document.getElementById("refbtn");
  if(rb) rb.textContent = t("refBtn");
}
function writeClip(plain,html,okMsg){
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      navigator.clipboard.write([new ClipboardItem({"text/plain":new Blob([plain],{type:"text/plain"}),"text/html":new Blob([html],{type:"text/html"})})])
        .then(()=>toast(okMsg),()=>fallbackText(plain,okMsg));
    } else fallbackText(plain,okMsg);
  }catch(err){ fallbackText(plain,okMsg); }
}
function fallbackText(plain,okMsg){
  try{ navigator.clipboard.writeText(plain).then(()=>toast(okMsg),()=>toast(`${t("copyFail")}\n${plain}`)); }
  catch(err){ toast(`${t("copyFail")}\n${plain}`); }
}
/* botão: copia só a referência do parágrafo */
app.addEventListener("click",e=>{
  const rb = e.target.closest("#refbtn");
  if(rb){
    const f = findWork(rb.dataset.a,rb.dataset.w); if(!f) return;
    const st = CS==="plain" ? "abnt" : CS;
    const c = citeParts(f.a,f.w,rb.dataset.s,"","",st);
    writeClip(c.ref, c.refH, `${t("copied")} (${STYLE_NAMES[st]})`);
    return;
  }
  const b = e.target.closest(".cite"); if(!b) return;
  const f = findWork(b.dataset.a,b.dataset.w); if(!f) return;
  const sec = f.w.secs.find(s=>s.id===b.dataset.s); const p = sec.paras[+b.dataset.k];
  const st = CS==="plain" ? "abnt" : CS;
  const c = citeParts(f.a,f.w,sec.id,p.ref,"",st);
  writeClip(c.ref, c.refH, `${t("copied")} (${STYLE_NAMES[st]})`);
});
/* Ctrl+C: trecho selecionado sai como citação */
document.addEventListener("copy",e=>{
  if(CS==="plain") return;
  const sel = window.getSelection(); if(!sel || sel.isCollapsed || !sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const node = n=> n && (n.nodeType===1 ? n : n.parentElement);
  const p1 = node(range.startContainer)?.closest(".para"), p2 = node(range.endContainer)?.closest(".para");
  if(!p1 || !p2) return;
  const [aid,wid,sid] = p1.id.split(".");
  const f = findWork(aid,wid); if(!f) return;
  const frag = range.cloneContents();
  frag.querySelectorAll(".ref,.cite,.spk,.ms").forEach(x=>x.remove());
  const quote = frag.textContent.replace(/\s+/g," ").trim(); if(!quote) return;
  /* locator: the reference section in force at the start and end of the selection */
  const msBefore = (p,edge)=>{ let r = p.querySelector(".ref").textContent;
    p.querySelectorAll(".ms").forEach(m=>{ try{ if(range.comparePoint(m,0) <= edge) r = m.dataset.ms; }catch(err){} });
    return r; };
  const r1 = msBefore(p1,-1), r2 = msBefore(p2,0);
  const loc = r1===r2 ? r1 : `${r1}–${r2}`;
  const c = citeParts(f.a,f.w,sid,loc,quote,CS);
  e.clipboardData.setData("text/plain", c.inText);
  e.clipboardData.setData("text/html", c.inTextH);
  e.preventDefault();
  toast(t("copiedQ")(STYLE_NAMES[CS]));
});
/* tema claro/escuro: segue o sistema até o leitor escolher */
const root = document.documentElement, tBtn = $("#themebtn");
const isDark = ()=> root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
try{ const th = localStorage.getItem("corpus-theme"); if(th==="dark"||th==="light") root.dataset.theme = th; }catch(e){}
function themeLabel(){ const l = isDark() ? t("themeToLight") : t("themeToDark"); tBtn.title = l; tBtn.setAttribute("aria-label",l); }
tBtn.onclick = ()=>{
  root.dataset.theme = isDark() ? "light" : "dark";
  try{ localStorage.setItem("corpus-theme",root.dataset.theme); }catch(e){}
  themeLabel();
};
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",themeLabel); }catch(e){}
const sCit = $("#sel-cit");
sCit.value = CS;
sCit.onchange = ()=>{ CS = sCit.value; try{localStorage.setItem("corpus-cite",CS);}catch(e){} updateHint(); };
window.addEventListener("hashchange",route);
applyLang(); route();
</script>
